# ═══════════════════════════════════════════════════════
#   Covalent GP Backend — Development Configuration
#   Active profile: dev
# ═══════════════════════════════════════════════════════

# ─── Server ──────────────────────────────────────────
server.port=8080

# ─── Database — MS SQL Server (Windows Auth) ─────────
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=GP_db;encrypt=false;integratedSecurity=true}

spring.datasource.username=${DB_USERNAME:}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# ─── JPA / Hibernate ─────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ─────────────────────────────────────────────
jwt.secret=bXlTdXBlclNlY3JldEp3dEtleVRoYXRJc0F0TGVhc3QzMkNoYXJhY3RlcnNMb25nIQ==

# Access token lifetime: 15 minutes (in milliseconds 900000)
jwt.expiration-ms=900000

# Refresh token lifetime: 7 days (in milliseconds)
jwt.refresh-expiration-ms=604800000

# Password reset token lifetime: 15 minutes (in milliseconds 900000)
reset.token-expiration-ms=900000

# ─── Email (SMTP via Gmail) ───────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=covalent.platform@gmail.com
spring.mail.password=bkia lkgp nxck rlot
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── ML Space Recommendation Service ──────────────────────────────────────
ml.service.base-url=http://localhost:5001

# ─── Python prediction service ─────────────────────────────────────────────
prediction.service.url=http://localhost:5002
prediction.service.connect-timeout-ms=5000
prediction.service.read-timeout-ms=30000

# Resilience4j circuit breaker for the prediction service
resilience4j.circuitbreaker.instances.prediction-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.prediction-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.prediction-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.prediction-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.prediction-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.prediction-service.ignoreExceptions=com.gp.GP_backend.domain.prediction.exception.InsufficientCourseDataException

# Base URL used to build the reset link in the email sent
app.frontend-url=http://localhost:5173

# ─── File Storage ────────────────────────────────────
app.storage.upload-dir=uploads

# ─── Multipart File Upload ────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ─── Logging ─────────────────────────────────────────
# Suppress a noisy Spring Security init message that clutters startup logs.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR