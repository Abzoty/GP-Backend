# ═══════════════════════════════════════════════════════
#   Covalent GP Backend — Development Configuration
#   Active profile: dev (set in application.properties)
#   ⚠ Never commit production secrets to version control!
# ═══════════════════════════════════════════════════════

# ─── Server ──────────────────────────────────────────
server.port=8080

# ─── Database — MS SQL Server (Windows Auth) ─────────
# Uses Windows Integrated Security — no username/password needed locally.
# Set encrypt=true and provide a certificate in production.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=GP_db;encrypt=false;integratedSecurity=true}

spring.datasource.username=${DB_USERNAME:}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# ─── JPA / Hibernate ─────────────────────────────────
# 'update' = Hibernate will CREATE new tables and ADD new columns automatically.
# It will NOT drop or rename existing columns — safe for active development.
# Switch to 'validate' in production to catch schema drift early.
spring.jpa.hibernate.ddl-auto=update

# Prevents lazy-loading queries from firing after the HTTP response is committed.
spring.jpa.open-in-view=false

# Show SQL in logs for debugging (disable in production to reduce noise).
spring.jpa.show-sql=false

# Tells Hibernate to format SQL when show-sql=true (easier to read).
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ─────────────────────────────────────────────
# Secret must be a Base64-encoded string of at least 32 bytes (256 bits).
# Generate a new one for production: `openssl rand -base64 64`
jwt.secret=bXlTdXBlclNlY3JldEp3dEtleVRoYXRJc0F0TGVhc3QzMkNoYXJhY3RlcnNMb25nIQ==

# Access token lifetime: 15 minutes (in milliseconds 900000)
jwt.expiration-ms=900000

# Refresh token lifetime: 7 days (in milliseconds)
jwt.refresh-expiration-ms=604800000

# Password reset token lifetime: 15 minutes (in milliseconds 900000)
reset.token-expiration-ms=900000

# ─── Email (SMTP via Gmail) ───────────────────────────
# In production, use environment variables:
#   SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=covalent.platform@gmail.com
spring.mail.password=bkia lkgp nxck rlot
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── ML Space Recommendation Service ──────────────────────────────────────
# Base URL for the Python recommendation service. Injected into WebClientConfig.
ml.service.base-url=http://localhost:5001

# ─── Python prediction service ─────────────────────────────────────────────
prediction.service.url=http://localhost:5002
prediction.service.connect-timeout-ms=5000
prediction.service.read-timeout-ms=30000

# Resilience4j circuit breaker for the prediction service
resilience4j.circuitbreaker.instances.prediction-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.prediction-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.prediction-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.prediction-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.prediction-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.prediction-service.ignoreExceptions=com.gp.GP_backend.domain.prediction.exception.InsufficientCourseDataException

# Base URL used to build the reset link in the email
app.frontend-url=http://localhost:5173

# ─── File Storage ────────────────────────────────────
# Directory where uploaded files are stored.
# - Path is relative to the JVM working directory (project root when running locally).
# - Created automatically by FileStorageService on startup if it does not exist.
# - In production, use an absolute path or an environment variable, e.g.:
#     app.storage.upload-dir=/var/covalent/uploads
app.storage.upload-dir=uploads

# ─── Multipart File Upload ────────────────────────────
# Spring checks these limits BEFORE the request reaches FileStorageService.
# Keep max-file-size in sync with FileStorageService.MAX_FILE_SIZE_BYTES (10 MB).
# max-request-size is set slightly higher to account for form-field overhead.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ─── Logging ─────────────────────────────────────────
# Suppress a noisy Spring Security init message that clutters startup logs.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR