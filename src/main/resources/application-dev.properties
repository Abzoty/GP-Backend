# ═══════════════════════════════════════════════════════
#   Covalent GP Backend — Development Configuration
#   Active profile: dev (set in application.properties)
#   ⚠ Never commit production secrets to version control!
# ═══════════════════════════════════════════════════════

# ─── Server ──────────────────────────────────────────
server.port=8080

# ─── Database — MS SQL Server (Windows Auth) ─────────
# Uses Windows Integrated Security — no username/password needed locally.
# Set encrypt=true and provide a certificate in production.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GP_db;encrypt=false;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ─── JPA / Hibernate ─────────────────────────────────
# 'update' = Hibernate will CREATE new tables and ADD new columns automatically.
# It will NOT drop or rename existing columns — safe for active development.
# Switch to 'validate' in production to catch schema drift early.
spring.jpa.hibernate.ddl-auto=update

# Prevents lazy-loading queries from firing after the HTTP response is committed.
spring.jpa.open-in-view=false

# Show SQL in logs for debugging (disable in production to reduce noise).
spring.jpa.show-sql=false

# Tells Hibernate to format SQL when show-sql=true (easier to read).
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ─────────────────────────────────────────────
# Secret must be a Base64-encoded string of at least 32 bytes (256 bits).
# Generate a new one for production: `openssl rand -base64 64`
jwt.secret=bXlTdXBlclNlY3JldEp3dEtleVRoYXRJc0F0TGVhc3QzMkNoYXJhY3RlcnNMb25nIQ==

# Access token lifetime: 15 minutes (in milliseconds 900000)
jwt.expiration-ms=900000

# Refresh token lifetime: 7 days (in milliseconds)
jwt.refresh-expiration-ms=604800000

# Password reset token lifetime: 15 minutes (in milliseconds)
reset.token-expiration-ms=900000

