# Local Server 
server.port=8080 

# Disable open-in-view to prevent lazy DB queries from firing during HTTP response rendering
spring.jpa.open-in-view=false

# Local Security Testing
spring.security.user.name=admin
spring.security.user.password=0123

# Local DataSource — MS SQL Server (Windows Authentication)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GP_db;encrypt=false;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Local JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

