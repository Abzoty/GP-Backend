# ============================================================
# Development Profile — Local MS SQL Server
# ============================================================

server.port=8080

# Prevents lazy-loading DB queries from firing inside HTTP response serialization
spring.jpa.open-in-view=false

# ------------------------------------
# Spring Boot Actuator Security (dev only)
# ------------------------------------
spring.security.user.name=admin
spring.security.user.password=0123

# ------------------------------------
# DataSource — MS SQL Server (Windows Authentication)
# ------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GP_db;encrypt=false;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ------------------------------------
# JPA / Hibernate
# ------------------------------------
# 'update' adds new columns / tables automatically; does NOT drop existing ones.
# WARNING: Changing a column type (e.g. id BIGINT → UNIQUEIDENTIFIER) requires
# a manual schema reset — drop the database and re-run database-init.sql.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Explicit dialect avoids auto-detection warnings with SQL Server
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Format UUID as lowercase string in JSON (Jackson default)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# 256-bit Base64 secret  (Base64 of "mySuperSecretJwtKeyForGPBackendApplication2025")
# IMPORTANT: Replace this with a securely-generated key in production!
jwt.secret=bXlTdXBlclNlY3JldEp3dEtleUZvckdQQmFja2VuZEFwcGxpY2F0aW9uMjAyNQ==

# Access token lifetime: 15 minutes (900 000 ms)
jwt.expiration-ms=900000

# Refresh token lifetime: 7 days (604 800 000 ms)
jwt.refresh-expiration-ms=604800000

