# Local Server 
server.port=8080 

# Local Security Testing
spring.security.user.name=admin
spring.security.user.password=0123

# Local DataSource — MS SQL Server (Windows Authentication)
# -> Note: integratedSecurity=true is required for Windows Auth
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GP_db;encrypt=false;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Local JPA / Hibernate 
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=false 
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect 
spring.jpa.properties.hibernate.format_sql=true 

