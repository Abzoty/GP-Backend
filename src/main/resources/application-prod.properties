# ─── File Storage ────────────────────────────────────
# Directory where uploaded files are stored.
# - Path is relative to the JVM working directory (project root when running locally).
# - Created automatically by FileStorageService on startup if it does not exist.
# - In production, use an absolute path or an environment variable, e.g.:
#     app.storage.upload-dir=/var/covalent/uploads
app.storage.upload-dir=uploads

# ─── Multipart File Upload ────────────────────────────
# Spring checks these limits BEFORE the request reaches FileStorageService.
# Keep max-file-size in sync with FileStorageService.MAX_FILE_SIZE_BYTES (10 MB).
# max-request-size is set slightly higher to account for form-field overhead.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB