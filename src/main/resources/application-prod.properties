#   Covalent GP Backend — Production Configuration
#
#   NOTE: Keep secrets out of source control. Prefer environment variables.
#   Example: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, ...
#+#+#+#+━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ─── JPA / Hibernate ─────────────────────────────────
# In production, do not auto-mutate schema; validate it instead.
spring.jpa.hibernate.ddl-auto=validate

# Prevent lazy-loading queries after the HTTP response is committed.
spring.jpa.open-in-view=false

# Reduce log noise in production.
spring.jpa.show-sql=false

